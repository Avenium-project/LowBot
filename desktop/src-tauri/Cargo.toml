[package]
name = "lowbot"
version = "2.0.0"
description = "LowBot desktop client"
edition = "2021"
license = "MIT"

[lib]
name = "lowbot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

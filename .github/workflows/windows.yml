name: windows-exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build UI
        run: |
          npm --prefix client ci
          npm --prefix client run build:export
      - name: Build installer (NSIS .exe + .msi)
        working-directory: desktop
        run: |
          npm ci || npm install
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: open-dots-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
      - name: Silent install smoke test on the clean runner
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          $app = Get-ChildItem "$env:LOCALAPPDATA\Open Dots" -Filter "*.exe" -Recurse | Where-Object { $_.Name -notlike "uninstall*" } | Select-Object -First 1
          if (-not $app) { throw "installed app not found" }
          $p = Start-Process $app.FullName -PassThru; Start-Sleep 10
          if ($p.HasExited) { throw "app exited early" }; Stop-Process $p

name: android-apk
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["mobile/**", "client/**", ".github/workflows/android.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.LOWBOT_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
        with: { packages: "platforms;android-35 build-tools;35.0.0" }
      - name: Build web UI
        run: npm --prefix client ci && npm --prefix client run build:export
      - name: Test APK (local test signing key)
        env: { VERSION_CODE: "${{ github.run_number }}" }
        run: mobile/build-apk.sh test
      - name: Release APK (production key from secrets; skipped if absent)
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          LOWBOT_KEYSTORE_PASSWORD: ${{ secrets.LOWBOT_KEYSTORE_PASSWORD }}
          LOWBOT_KEY_ALIAS: ${{ secrets.LOWBOT_KEY_ALIAS }}
          LOWBOT_KEY_PASSWORD: ${{ secrets.LOWBOT_KEY_PASSWORD }}
          VERSION_CODE: "${{ github.run_number }}"
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cp mobile/build/LowBot-*-test.apk "$RUNNER_TEMP/" || true
          LOWBOT_KEYSTORE="$RUNNER_TEMP/release.jks" mobile/build-apk.sh release
          cp "$RUNNER_TEMP"/LowBot-*-test.apk mobile/build/ || true
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with: { name: LowBot-apk, path: "mobile/build/LowBot-*.apk" }

  install-test:
    # Installs the APK on an Android 15 emulator, launches it, checks the first screen and
    # runs the on-device self-test of the phone-hosted backend.
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: LowBot-apk, path: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: bash mobile/ci-emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LowBot-emulator-results
          path: |
            lowbot-launch.png
            ui.xml
            selftest-log.txt

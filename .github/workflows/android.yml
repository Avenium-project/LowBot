name: android-apk
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
      - name: Build UI and sync Capacitor
        run: |
          npm --prefix client ci
          npm --prefix client run build:export
          npm --prefix mobile ci
          cd mobile && npx cap sync android
      - name: Debug APK (test signing key only)
        working-directory: mobile/android
        env: { VERSION_CODE: "${{ github.run_number }}" }
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: open-dots-debug-apk, path: mobile/android/app/build/outputs/apk/debug/*.apk }
      - name: Release APK (production key from secrets; skipped if absent)
        if: ${{ env.KEYSTORE_B64 != '' }}
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: "${{ github.run_number }}"
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('mobile/android/app/build/outputs/apk/release/*.apk') != '' }}
        with: { name: open-dots-release-apk, path: mobile/android/app/build/outputs/apk/release/*.apk }

  install-test:
    # Installs the debug APK on an emulator and checks the app process starts.
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: open-dots-debug-apk, path: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install -r apk/*.apk
            adb shell monkey -p io.lowbot.opendots.debug -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell pidof io.lowbot.opendots.debug
